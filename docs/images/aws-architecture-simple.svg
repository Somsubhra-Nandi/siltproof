<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">SiltProof live evidence pipeline on AWS</title><desc id="d">Upload to Amazon S3 through Amazon API Gateway and AWS Lambda, read with Amazon Textract and Amazon Bedrock Nova Pro, cross-check with deterministic rules, store in Amazon DynamoDB, and leave the decision to the engineer.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4756"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3A4756"/></marker>
</defs><rect width="1280" height="560" fill="#FFFFFF"/><text x="60" y="66" font-size="32" font-weight="700" fill="#16212E">Evidence before expenditure</text><text x="60" y="100" font-size="18" fill="#4A5868">The live Try SiltProof Yourself pipeline</text><rect x="60" y="150" width="255" height="260" rx="16" fill="#fff" stroke="#CBD3DC" stroke-width="1.5"/><rect x="60" y="150" width="255" height="10" rx="5" fill="#3B7D23"/><text x="84" y="206" font-size="24" font-weight="700" fill="#16212E">1  Upload</text><text x="84" y="258" font-size="21" font-weight="600" fill="#3B7D23">Amazon S3</text><text x="84" y="350" font-size="16" fill="#4A5868">Presigned upload via</text><text x="84" y="376" font-size="16" fill="#4A5868">API Gateway + Lambda</text><line x1="321" y1="280" x2="357" y2="280" stroke="#3A4756" stroke-width="2.4" marker-end="url(#ah)"/><rect x="363" y="150" width="255" height="260" rx="16" fill="#fff" stroke="#CBD3DC" stroke-width="1.5"/><rect x="363" y="150" width="255" height="10" rx="5" fill="#017E6A"/><text x="387" y="206" font-size="24" font-weight="700" fill="#16212E">2  Read</text><text x="387" y="258" font-size="21" font-weight="600" fill="#017E6A">Amazon Textract</text><text x="387" y="290" font-size="21" font-weight="600" fill="#017E6A">Amazon Bedrock</text><text x="387" y="350" font-size="16" fill="#4A5868">Slips: Queries OCR</text><text x="387" y="376" font-size="16" fill="#4A5868">Photos: Nova Pro</text><line x1="624" y1="280" x2="660" y2="280" stroke="#3A4756" stroke-width="2.4" marker-end="url(#ah)"/><rect x="666" y="150" width="255" height="260" rx="16" fill="#fff" stroke="#CBD3DC" stroke-width="1.5"/><rect x="666" y="150" width="255" height="10" rx="5" fill="#D45B07"/><text x="690" y="206" font-size="24" font-weight="700" fill="#16212E">3  Cross-check</text><text x="690" y="258" font-size="21" font-weight="600" fill="#D45B07">AWS Lambda</text><text x="690" y="350" font-size="16" fill="#4A5868">Deterministic rules</text><text x="690" y="376" font-size="16" fill="#4A5868">R1–R10, no AI score</text><line x1="927" y1="280" x2="963" y2="280" stroke="#3A4756" stroke-width="2.4" marker-end="url(#ah)"/><rect x="969" y="150" width="255" height="260" rx="16" fill="#fff" stroke="#CBD3DC" stroke-width="1.5"/><rect x="969" y="150" width="255" height="10" rx="5" fill="#334155"/><text x="993" y="206" font-size="24" font-weight="700" fill="#16212E">4  Decide</text><text x="993" y="258" font-size="21" font-weight="600" fill="#334155">A person</text><text x="993" y="350" font-size="16" fill="#4A5868">Explainable findings;</text><text x="993" y="376" font-size="16" fill="#4A5868">no automatic verdict</text><rect x="60" y="440" width="1161" height="76" rx="14" fill="#F2F6FA" stroke="#D6DFE9"/><text x="84" y="474" font-size="17" font-weight="700" fill="#16212E">Amazon DynamoDB</text><text x="260" y="474" font-size="17" fill="#4A5868">keeps trial state, readings, quotas and results; trial records expire after about 48 hours.</text><text x="84" y="500" font-size="15" fill="#6B7887">Hosted on AWS Amplify · maps from Amazon Location Service · deployed with AWS SAM</text></svg>
