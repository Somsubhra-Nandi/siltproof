<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">SiltProof AWS architecture</title><desc id="d">Two paths. A: the prepared 18-drain investigation is a static React app on AWS Amplify Hosting with Amazon Location maps; its results were computed offline by the same rules code. B: Try SiltProof Yourself sends evidence through Amazon API Gateway and AWS Lambda to Amazon S3, Amazon Textract, Amazon Bedrock (Nova Pro) and Amazon DynamoDB, then runs deterministic rules.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4756"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3A4756"/></marker>
</defs><rect width="1280" height="830" fill="#FFFFFF"/><text x="40" y="46" font-size="24" font-weight="700" fill="#16212E">SiltProof on AWS</text><text x="40" y="70" font-size="14" fill="#4A5868">Two execution paths: a prepared investigation served as static files, and a live trial that runs the AWS evidence pipeline.</text><rect x="20" y="90" width="1240" height="250" rx="14" fill="#F2F6FA" stroke="#D6DFE9"/><text x="40" y="118" font-size="13" font-weight="700" fill="#16212E" letter-spacing="0.8">A · PREPARED 18-DRAIN INVESTIGATION</text><text x="345" y="118" font-size="12" fill="#6B7887">index.html · Bill B1, a fictional case study</text><g><rect x="40" y="140" width="210" height="170" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="40" y="150" width="5" height="150" rx="2.5" fill="#334155"/><text x="58" y="170" font-size="14" font-weight="700" fill="#16212E">Browser</text><text x="58" y="191" font-size="13" fill="#4A5868">React + MapLibre GL</text><text x="58" y="210" font-size="13" fill="#4A5868">Ward map, case files,</text><text x="58" y="229" font-size="13" fill="#4A5868">payment ledger</text><text x="58" y="248" font-size="13" fill="#4A5868">Decisions stay in</text><text x="58" y="267" font-size="13" fill="#4A5868">this browser</text></g><g><rect x="330" y="140" width="280" height="76" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="330" y="150" width="5" height="56" rx="2.5" fill="#C7253E"/><text x="348" y="170" font-size="14" font-weight="700" fill="#16212E">AWS Amplify Hosting</text><text x="348" y="191" font-size="13" fill="#4A5868">Static build + prepared snapshot</text></g><g><rect x="330" y="234" width="280" height="76" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="330" y="244" width="5" height="56" rx="2.5" fill="#C7253E"/><text x="348" y="264" font-size="14" font-weight="700" fill="#16212E">Amazon Location Service</text><text x="348" y="285" font-size="13" fill="#4A5868">Maps v2 style and tiles</text></g><line x1="250" y1="178" x2="328" y2="178" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><text x="289" y="170" font-size="12" fill="#4A5868" text-anchor="middle">app + data</text><line x1="250" y1="272" x2="328" y2="272" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><text x="289" y="264" font-size="12" fill="#4A5868" text-anchor="middle">map tiles</text><rect x="690" y="140" width="550" height="170" rx="10" fill="#fff" stroke="#9AA7B5" stroke-dasharray="5 4"/><text x="708" y="166" font-size="13" font-weight="700" fill="#16212E">Computed offline before deployment</text><text x="708" y="184" font-size="12" fill="#4A5868">scripts/make_demo_fixtures.py · no AWS calls</text><rect x="708" y="200" width="90" height="46" rx="8" fill="#F2F6FA" stroke="#CBD3DC"/><text x="753" y="219" font-size="11.5" fill="#16212E" text-anchor="middle">Dataset</text><text x="753" y="235" font-size="11.5" fill="#16212E" text-anchor="middle">generators</text><text x="805" y="228" font-size="16" fill="#6B7887" text-anchor="middle">›</text><rect x="812" y="200" width="90" height="46" rx="8" fill="#F2F6FA" stroke="#CBD3DC"/><text x="857" y="219" font-size="11.5" fill="#16212E" text-anchor="middle">moto S3 +</text><text x="857" y="235" font-size="11.5" fill="#16212E" text-anchor="middle">DynamoDB</text><text x="909" y="228" font-size="16" fill="#6B7887" text-anchor="middle">›</text><rect x="916" y="200" width="90" height="46" rx="8" fill="#F2F6FA" stroke="#CBD3DC"/><text x="961" y="219" font-size="11.5" fill="#16212E" text-anchor="middle">Ingest with</text><text x="961" y="235" font-size="11.5" fill="#16212E" text-anchor="middle">fixtures</text><text x="1013" y="228" font-size="16" fill="#6B7887" text-anchor="middle">›</text><rect x="1020" y="200" width="90" height="46" rx="8" fill="#F2F6FA" stroke="#CBD3DC"/><text x="1065" y="219" font-size="11.5" fill="#16212E" text-anchor="middle">rules.py</text><text x="1065" y="235" font-size="11.5" fill="#16212E" text-anchor="middle">R1–R10</text><text x="1117" y="228" font-size="16" fill="#6B7887" text-anchor="middle">›</text><rect x="1124" y="200" width="90" height="46" rx="8" fill="#F2F6FA" stroke="#CBD3DC"/><text x="1169" y="219" font-size="11.5" fill="#16212E" text-anchor="middle">Snapshot</text><text x="1169" y="235" font-size="11.5" fill="#16212E" text-anchor="middle">JSON</text><text x="708" y="274" font-size="12.5" fill="#4A5868">Same rules code as the live API. Slip confidences and photo</text><text x="708" y="292" font-size="12.5" fill="#4A5868">observations are prepared values, not live Textract or Bedrock output.</text><line x1="690" y1="178" x2="612" y2="178" stroke="#3A4756" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="651" y="170" font-size="12" fill="#4A5868" text-anchor="middle">deployed</text><rect x="20" y="358" width="1240" height="340" rx="14" fill="#FBF6F0" stroke="#EADFD2"/><text x="40" y="386" font-size="13" font-weight="700" fill="#16212E" letter-spacing="0.8">B · TRY SILTPROOF YOURSELF</text><text x="288" y="386" font-size="12" fill="#6B7887">trial.html · the judge's own files, read live on AWS</text><g><rect x="40" y="470" width="210" height="140" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="40" y="480" width="5" height="120" rx="2.5" fill="#334155"/><text x="58" y="500" font-size="14" font-weight="700" fill="#16212E">Browser</text><text x="58" y="521" font-size="13" fill="#4A5868">Invite code starts a</text><text x="58" y="540" font-size="13" fill="#4A5868">private trial; a bearer</text><text x="58" y="559" font-size="13" fill="#4A5868">token scopes every call</text><text x="58" y="578" font-size="13" fill="#4A5868">after that</text></g><g><rect x="330" y="412" width="230" height="82" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="330" y="422" width="5" height="62" rx="2.5" fill="#6E3FD6"/><text x="348" y="442" font-size="14" font-weight="700" fill="#16212E">Amazon API Gateway</text><text x="348" y="463" font-size="13" fill="#4A5868">HTTP API</text><text x="348" y="482" font-size="13" fill="#4A5868">Per-route throttling</text></g><g><rect x="640" y="412" width="250" height="82" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="640" y="422" width="5" height="62" rx="2.5" fill="#D45B07"/><text x="658" y="442" font-size="14" font-weight="700" fill="#16212E">AWS Lambda · api</text><text x="658" y="463" font-size="13" fill="#4A5868">Trial routes, upload checks</text><text x="658" y="482" font-size="13" fill="#4A5868">Rules R1–R10 + T1–T3</text></g><g><rect x="970" y="412" width="270" height="82" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="970" y="422" width="5" height="62" rx="2.5" fill="#B0229F"/><text x="988" y="442" font-size="14" font-weight="700" fill="#16212E">Amazon DynamoDB</text><text x="988" y="463" font-size="13" fill="#4A5868">Trials, file state, quotas,</text><text x="988" y="482" font-size="13" fill="#4A5868">results · TTL about 48 h</text></g><g><rect x="330" y="584" width="230" height="96" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="330" y="594" width="5" height="76" rx="2.5" fill="#3B7D23"/><text x="348" y="614" font-size="14" font-weight="700" fill="#16212E">Amazon S3</text><text x="348" y="635" font-size="13" fill="#4A5868">Private evidence bucket</text><text x="348" y="654" font-size="13" fill="#4A5868">trials/ objects expire</text><text x="348" y="673" font-size="13" fill="#4A5868">after about 48 h</text></g><g><rect x="640" y="584" width="250" height="96" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="640" y="594" width="5" height="76" rx="2.5" fill="#D45B07"/><text x="658" y="614" font-size="14" font-weight="700" fill="#16212E">AWS Lambda · ingest</text><text x="658" y="635" font-size="13" fill="#4A5868">SHA-256, EXIF, pHash</text><text x="658" y="654" font-size="13" fill="#4A5868">Quota reserved before</text><text x="658" y="673" font-size="13" fill="#4A5868">every model call</text></g><g><rect x="970" y="566" width="270" height="56" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="970" y="576" width="5" height="36" rx="2.5" fill="#017E6A"/><text x="988" y="596" font-size="14" font-weight="700" fill="#16212E">Amazon Textract</text><text x="988" y="615.5" font-size="11.5" fill="#4A5868">AnalyzeDocument · Queries · slips</text></g><g><rect x="970" y="634" width="270" height="56" rx="10" fill="#fff" stroke="#CBD3DC"/><rect x="970" y="644" width="5" height="36" rx="2.5" fill="#017E6A"/><text x="988" y="664" font-size="14" font-weight="700" fill="#16212E">Amazon Bedrock · Nova Pro</text><text x="988" y="683.5" font-size="11.5" fill="#4A5868">Converse, forced tool · photos</text></g><line x1="250" y1="505" x2="328" y2="460" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/><circle cx="264" cy="472" r="10" fill="#16212E"/><text x="264" y="476" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="290" cy="457" r="10" fill="#16212E"/><text x="290" y="461" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><line x1="560" y1="453" x2="638" y2="453" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="890" y1="453" x2="968" y2="453" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="250" y1="580" x2="328" y2="625" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="276" cy="618" r="10" fill="#16212E"/><text x="276" y="622" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="318" y="652" font-size="11.5" fill="#4A5868" text-anchor="end">presigned POST</text><line x1="700" y1="494" x2="532" y2="582" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><text x="602" y="524" font-size="11.5" fill="#4A5868" text-anchor="end">presign, verify</text><line x1="765" y1="494" x2="765" y2="582" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="785" cy="538" r="10" fill="#16212E"/><text x="785" y="542" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="800" y="542" font-size="11.5" fill="#4A5868" text-anchor="start">async invoke</text><line x1="640" y1="632" x2="562" y2="632" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><text x="601" y="624" font-size="11.5" fill="#4A5868" text-anchor="middle">reads file</text><line x1="890" y1="612" x2="968" y2="594" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><line x1="890" y1="652" x2="968" y2="662" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="925" cy="627" r="10" fill="#16212E"/><text x="925" y="631" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="872" y1="584" x2="1000" y2="496" stroke="#3A4756" stroke-width="1.6" marker-end="url(#ah)"/><text x="958" y="548" font-size="11.5" fill="#4A5868" text-anchor="start">readings</text><circle cx="628" cy="381" r="10" fill="#16212E"/><text x="628" y="385" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="643" y="385" font-size="11.5" fill="#16212E" text-anchor="start">Create trial</text><circle cx="742.4" cy="381" r="10" fill="#16212E"/><text x="742.4" y="385" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="757.4" y="385" font-size="11.5" fill="#16212E" text-anchor="start">Upload to S3</text><circle cx="856.8" cy="381" r="10" fill="#16212E"/><text x="856.8" y="385" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="871.8" y="385" font-size="11.5" fill="#16212E" text-anchor="start">Verify + queue</text><circle cx="983.5999999999999" cy="381" r="10" fill="#16212E"/><text x="983.5999999999999" y="385" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="998.5999999999999" y="385" font-size="11.5" fill="#16212E" text-anchor="start">OCR / vision</text><circle cx="1098" cy="381" r="10" fill="#16212E"/><text x="1098" y="385" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1113" y="385" font-size="11.5" fill="#16212E" text-anchor="start">Analyze → results</text><rect x="20" y="716" width="1240" height="94" rx="14" fill="#F6F7F9" stroke="#DDE2E8"/><text x="40" y="742" font-size="13" font-weight="700" fill="#16212E" letter-spacing="0.8">SUPPORTING · NOT IN THE REQUEST PATH</text><rect x="40" y="756" width="392" height="44" rx="8" fill="#fff" stroke="#CBD3DC"/><rect x="40" y="764" width="4" height="28" rx="2" fill="#C7253E"/><text x="54" y="774" font-size="12.5" font-weight="700" fill="#16212E">AWS IAM</text><text x="54" y="792" font-size="12" fill="#4A5868">A scoped role for each function</text><rect x="448" y="756" width="392" height="44" rx="8" fill="#fff" stroke="#CBD3DC"/><rect x="448" y="764" width="4" height="28" rx="2" fill="#6E3FD6"/><text x="462" y="774" font-size="12.5" font-weight="700" fill="#16212E">Amazon CloudWatch Logs</text><text x="462" y="792" font-size="12" fill="#4A5868">Structured JSON logs from both functions</text><rect x="856" y="756" width="392" height="44" rx="8" fill="#fff" stroke="#CBD3DC"/><rect x="856" y="764" width="4" height="28" rx="2" fill="#D45B07"/><text x="870" y="774" font-size="12.5" font-weight="700" fill="#16212E">AWS CloudFormation via AWS SAM</text><text x="870" y="792" font-size="12" fill="#4A5868">API, functions, bucket, table: infra/template.yaml</text></svg>
