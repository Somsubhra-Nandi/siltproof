AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SiltProof - desilting bill verification (hackathon MVP)

Parameters:
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
    Description: >-
      Bedrock model for the text evidence summary. Use an inference profile id
      (in.* / apac.* / global.*) if the region requires one. Verify with
      scripts/check_region.py before deploying.

  BedrockVisionModelId:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
    Description: >-
      Bedrock model for the before/after photo check, roughly 40 calls per seed.
      Must accept a forced toolChoice. Nova Pro is first-party, so it needs no
      Marketplace subscription (DECISIONS.md).

  IngestReservedConcurrency:
    Type: Number
    Default: 0
    Description: >-
      Reserved concurrency for the ingest function; 0 leaves it unreserved.
      Set 3 once the account's Lambda concurrency quota is above 13: a new
      account's quota is 10, and Lambda refuses any reservation that leaves
      fewer than 10 unreserved. At a quota of 10 the account itself is the cap.

  BillId:
    Type: String
    Default: B1
    Description: The single bill this deployment serves (plan section 1).

  # ---------------------------------------------------- judge trials
  # docs/JUDGE-TRIAL-API.md section 16. Hard caps, enforced with DynamoDB
  # conditional counters before each billable call.
  TrialInviteCode:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      When set, POST /trials needs this code (typed by the judge, never baked
      into the frontend). Empty leaves creation open, limited by TrialDailyTrials.

  TrialDailyTrials:
    Type: Number
    Default: 60
    Description: Trials that can be created per UTC day, across everyone.

  TrialDailyBedrockCalls:
    Type: Number
    Default: 200
    Description: Bedrock photo calls per UTC day across all trials. Fails closed.

  TrialDailyTextractCalls:
    Type: Number
    Default: 100
    Description: Textract slip calls per UTC day across all trials. Fails closed.

Conditions:
  ReserveIngestConcurrency: !Not [!Equals [!Ref IngestReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref SiltProofTable
        EVIDENCE_BUCKET: !Sub ${AWS::StackName}-evidence-${AWS::AccountId}
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_VISION_MODEL_ID: !Ref BedrockVisionModelId
        BILL_ID: !Ref BillId
        TRIAL_DAILY_TRIALS: !Ref TrialDailyTrials
        TRIAL_DAILY_BEDROCK_CALLS: !Ref TrialDailyBedrockCalls
        TRIAL_DAILY_TEXTRACT_CALLS: !Ref TrialDailyTextractCalls

Resources:
  # ---------------------------------------------------------------- storage
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Named explicitly, and referenced by name (never !Ref) from the
      # functions: a !Ref here plus an S3 event source is a circular
      # dependency in SAM.
      BucketName: !Sub ${AWS::StackName}-evidence-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        # Needed so the browser can PUT to a presigned URL (live upload demo),
        # and POST a judge-trial file to its presigned POST policy.
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, PUT, HEAD, POST]
            AllowedHeaders: ["*"]
      LifecycleConfiguration:
        Rules:
          # Judge-trial evidence: about 48 h. S3 rounds to the next midnight
          # UTC and expires asynchronously, so objects go 48-72+ h after upload.
          - Id: ExpireJudgeTrials
            Status: Enabled
            Prefix: trials/
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  SiltProofTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: siltproof
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Only judge-trial and quota items carry `ttl`; Bill B1 items have none
      # and are never expired.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ------------------------------------------------------------------- api
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # Open for local dev; this is a demo app with no auth (plan section 1).
        # Judge trials send a bearer token and use PUT and DELETE.
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      # Per-route throttling for the public trial routes; B1 routes keep the
      # account defaults.
      RouteSettings:
        "POST /trials":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /trials/{trialId}/upload-url":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        "POST /trials/{trialId}/evidence/{evidenceId}/complete":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        "POST /trials/{trialId}/evidence/{evidenceId}/retry":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "POST /trials/{trialId}/analyze":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "GET /trials/{trialId}":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  # ------------------------------------------------------------- functions
  # pillow + imagehash + numpy + scipy is ~200 MB, and only ingest reads
  # photos. A layer keeps the api function small and makes code-only redeploys
  # quick, which matters when iterating on Day 2.
  PhotoDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-photo-deps
      ContentUri: ../backend/layers/photo/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri is the whole backend tree so both functions share common/.
      CodeUri: ../backend/
      Handler: ingest.app.lambda_handler
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref PhotoDepsLayer
      # Keeps Bedrock/Textract calls from throttling while seeding ~40 photos.
      ReservedConcurrentExecutions: !If
        - ReserveIngestConcurrency
        - !Ref IngestReservedConcurrency
        - !Ref AWS::NoValue
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub ${AWS::StackName}-evidence-${AWS::AccountId}
        - DynamoDBCrudPolicy:
            TableName: !Ref SiltProofTable
        - Statement:
            - Sid: TextractSlips
              Effect: Allow
              # Textract has no resource-level permissions.
              Action: textract:AnalyzeDocument
              Resource: "*"
            - Sid: BedrockPhotoAnalysis
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
      Events:
        Photos:
          Type: S3
          Properties:
            Bucket: !Ref EvidenceBucket   # SAM wires the notification here
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: photos/
        Slips:
          Type: S3
          Properties:
            Bucket: !Ref EvidenceBucket   # SAM wires the notification here
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: slips/
        Traces:
          Type: S3
          Properties:
            Bucket: !Ref EvidenceBucket   # SAM wires the notification here
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: traces/

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: api.app.lambda_handler
      # HTTP API caps integration timeout at 30s; verification is fast rules only.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          # Judge trials: photos and slips are processed by the ingest
          # function, invoked asynchronously (it has Pillow and the AI policies).
          TRIAL_PROCESSOR_FUNCTION: !Ref IngestFunction
          TRIAL_INVITE_CODE: !Ref TrialInviteCode
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IngestFunction
        - S3CrudPolicy:
            BucketName: !Sub ${AWS::StackName}-evidence-${AWS::AccountId}
        - DynamoDBCrudPolicy:
            TableName: !Ref SiltProofTable
        - Statement:
            - Sid: BedrockEvidenceSummary
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        Verify:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /verify/{billId}
            Method: POST
        GetBill:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /bill/{billId}
            Method: GET
        GetDrain:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drain/{drainId}
            Method: GET
        DrainSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drain/{drainId}/summary
            Method: POST
        Decision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decision
            Method: POST
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: POST
        # ---- judge trials (docs/JUDGE-TRIAL-API.md)
        TrialCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials
            Method: POST
        TrialGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}
            Method: GET
        TrialDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}
            Method: DELETE
        TrialDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/details
            Method: PUT
        TrialUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/upload-url
            Method: POST
        TrialComplete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/evidence/{evidenceId}/complete
            Method: POST
        TrialRetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/evidence/{evidenceId}/retry
            Method: POST
        TrialEvidenceDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/evidence/{evidenceId}
            Method: DELETE
        TrialAnalyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/analyze
            Method: POST
        TrialResults:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trials/{trialId}/results
            Method: GET

Outputs:
  ApiUrl:
    Description: SiltProof HTTP API base URL (set as VITE_API_BASE_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  EvidenceBucketName:
    Description: S3 evidence bucket
    Value: !Ref EvidenceBucket

  TableName:
    Description: DynamoDB single table
    Value: !Ref SiltProofTable
